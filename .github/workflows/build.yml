name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Gradle 4.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 4.9

      - name: Compilar
        run: gradle setupCIWorkspace build --no-daemon

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: cyberware-sandevistan
          path: build/libs/*.jar
